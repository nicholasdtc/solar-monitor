# Installed to /etc/ssh/sshd_config.d/00-keys-only.conf by the steps in deploy/pi-setup.md.
# Logging in over SSH takes a key. Passwords aren't asked for, so they can't be guessed.
# sshd keeps the first value it reads for each setting, and reads this directory in name order,
# so the 00 puts these ahead of anything else there.

PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no

# Fewer tries and less waiting for each connection. Plenty for one key.
MaxAuthTries 3
LoginGraceTime 30

X11Forwarding no
