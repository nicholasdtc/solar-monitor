<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in - Solar monitor</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --border: rgba(11, 11, 11, 0.10);
    --field: rgba(11, 11, 11, 0.35);
    --critical: #d03b3b;
    --solar: #eb6834;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --border: rgba(255, 255, 255, 0.10);
      --field: rgba(255, 255, 255, 0.35);
      --solar: #d95926;
    }
  }
  * { box-sizing: border-box; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 16px;
    background: var(--page);
    color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    width: 100%;
    max-width: 340px;
    padding: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  svg { flex: none; stroke: var(--solar); fill: none; stroke-width: 1.5; stroke-linecap: round; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  label { display: block; margin-bottom: 14px; color: var(--ink-2); }
  input {
    display: block;
    width: 100%;
    margin-top: 4px;
    padding: 8px 10px;
    color: var(--ink);
    background: var(--page);
    border: 1px solid var(--field);
    border-radius: 8px;
    /* 16px stops phones zooming in on the field. */
    font: 16px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  button {
    width: 100%;
    margin-top: 6px;
    padding: 9px 12px;
    color: var(--page);
    background: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 8px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--solar); outline-offset: 2px; }
  .error { margin: 0 0 14px; padding: 8px 12px; border: 1px solid var(--critical); border-radius: 8px; }
</style>
</head>
<body>
<main>
  <header>
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>
    </svg>
    <h1>Solar monitor</h1>
  </header>
  <!--error-->
  <form method="post" action="/login">
    <label>Username
      <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button>Log in</button>
  </form>
</main>
</body>
</html>
