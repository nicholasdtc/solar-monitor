[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-monitor"
version = "0.1.0"
description = "Local monitoring for a GoodWe hybrid inverter and battery system"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "goodwe",
    "python-dotenv",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["httpx", "pytest"]

[project.scripts]
solar-monitor = "solar_monitor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solar_monitor = ["*.html", "fonts/*.woff2", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
